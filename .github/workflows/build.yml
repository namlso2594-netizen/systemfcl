name: Build System FCL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project
        run: |
          unzip -o System_FCL_Port_1.21.11_SOURCE.zip
          cd System_FCL_Port_1.21.11
          chmod +x gradlew
          ./gradlew --no-daemon build

      - uses: actions/upload-artifact@v4
        with:
          name: System-FCL-JAR
          path: System_FCL_Port_1.21.11/build/libs/*.jar
